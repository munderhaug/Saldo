name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: saldo
          POSTGRES_PASSWORD: saldo
          POSTGRES_DB: saldo
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U saldo"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://saldo:saldo@localhost:5432/saldo?sslmode=disable
    steps:
      # All third-party actions are SHA-pinned (supply-chain hardening, ADR 0017). Dependabot's
      # github-actions ecosystem keeps the pins fresh; the trailing comment tracks the human version.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0 # full history so commit-lint can resolve origin/main..HEAD
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: git fetch --no-tags origin main 2>/dev/null || true # so origin/main..HEAD resolves below
      - run: pnpm commitlint # Conventional Commits on this branch's commits (safe no-op if unresolved)
      - run: pnpm audit --audit-level=high # supply-chain gate
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm lint:repo # .claude harness + cited-docs + link integrity + no-contradiction gate
      - run: pnpm backlog validate # task graph: schema + no dangling deps + acyclic
      - run: pnpm format:check
      - run: pnpm type-coverage # no implicit-any leaks past the strict bar (>= 97%)
      - run: pnpm knip # dead-code gate: no unused files / exports / types (runs after typegen)
      - run: pnpm test
      - run: pnpm db:lint # squawk: unsafe-migration linter (forward migrations only)
      - run: pnpm db:migrate # migration check against real Postgres
      - run: pnpm db:introspect # schema generation stays in sync with migrations
      - run: pnpm build
      - run: pnpm saft:validate # SAF-T validate (SCAFFOLD — prints PENDING; validates nothing yet)
