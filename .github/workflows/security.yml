name: Security

# Secret scanning + a CycloneDX SBOM. Isolated from the core `verify` gate (ADR 0017); all actions
# are SHA-pinned. The SBOM is an audit artifact, not a gate, so it never fails the build.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '37 4 * * 1' # weekly, Monday 04:37 UTC

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # scan full history, not just the tip
      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sbom:
    runs-on: ubuntu-latest
    steps:
      # checkout must precede pnpm/action-setup: since v6 the action requires a pnpm version and
      # reads it from package.json's packageManager field, which only exists after checkout.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generate CycloneDX SBOM (pnpm-aware)
        continue-on-error: true # an audit artifact, never a gate
        run: pnpm exec cdxgen -t pnpm -o sbom.json --no-recurse # lockfile-pinned devDependency, not dlx
      - name: Upload SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-cyclonedx
          path: sbom.json
          if-no-files-found: warn
