version: 2
updates:
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      # Group low-risk updates to reduce PR noise; security updates always open individually.
      dev-dependencies:
        dependency-type: development
      production-dependencies:
        dependency-type: production

  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly

  # Keeps the runtime image's base (infra/docker/Dockerfile FROM) fresh. NB: the docker updater tracks
  # Dockerfile FROM lines only — compose.yaml / ci.yml service images are bumped manually on review.
  - package-ecosystem: docker
    directory: '/infra/docker'
    schedule:
      interval: weekly
    ignore:
      # The whole toolchain is pinned to Node 22 (.nvmrc, engines, CI setup-node). A base-image major
      # would silently fork prod off the tested runtime — node:26-slim also drops corepack, breaking
      # the pnpm bootstrap. Bump the major deliberately, everywhere at once, not via Dependabot.
      - dependency-name: node
        update-types: ['version-update:semver-major']
