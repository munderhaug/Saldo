name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25 # the full gate matrix incl. real Postgres + build; never trips on a healthy run
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: saldo
          POSTGRES_PASSWORD: saldo
          POSTGRES_DB: saldo
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U saldo"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://saldo:saldo@localhost:5432/saldo?sslmode=disable
    steps:
      # All third-party actions are SHA-pinned (supply-chain hardening, ADR 0017). Dependabot's
      # github-actions ecosystem keeps the pins fresh; the trailing comment tracks the human version.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0 # full history so commit-lint can resolve origin/main..HEAD
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: git fetch --no-tags origin main 2>/dev/null || true # so origin/main..HEAD resolves below
      - run: pnpm commitlint # Conventional Commits on this branch's commits (safe no-op if unresolved)
      # Visible but NON-blocking: a freshly-disclosed transitive advisory with no fix must not red-wall
      # every unrelated PR. The weekly freshness sweep + Dependabot security PRs are the triage path
      # (review §9). Re-add a hard gate only against a triaged allow/deny list, not raw audit-level.
      - run: pnpm audit --audit-level=high || true # supply-chain visibility (non-blocking)
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm lint:repo # .claude harness + cited-docs + link integrity + no-contradiction gate
      - run: pnpm backlog validate # task graph: schema + no dangling deps + acyclic
      - run: pnpm format:check
      - run: pnpm type-coverage # no implicit-any leaks past the strict bar (>= 97%)
      - run: pnpm knip # dead-code gate: no unused files / exports / types (runs after typegen)
      - run: pnpm test
      - run: pnpm db:lint # squawk: unsafe-migration linter (forward migrations only)
      - run: pnpm db:migrate # migration check against real Postgres
      - run: pnpm db:introspect # schema generation stays in sync with migrations
      - run: pnpm build
      - run: pnpm saft:validate # SAF-T Financial: generate + tie-out + well-formedness + XSD validation (real gate)
      - run: pnpm mva:validate # MVA-melding: generate + well-formedness + grounded subset + tie-out (real gate)
      - run: pnpm ehf:validate # EHF/PEPPOL: generate + well-formedness + BIS Billing 3.0 subset (real gate)

  # Build the production image and prove the PRUNED, non-root runtime actually boots and serves. This
  # is the verification gate that makes the prod-only deps prune safe (review 2026-06-28, H3): without
  # it the Dockerfile is never exercised in CI. Docker is pre-installed on ubuntu-latest, so no
  # third-party action (and no SHA pin) is needed beyond checkout.
  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: docker build -f infra/docker/Dockerfile -t saldo-web:ci .
      - name: Smoke-test the image boots and serves
        run: |
          # env.ts validates DATABASE_URL (a required z.string().url()) at boot, so pass a DUMMY one —
          # the "/" loader redirects to /auth/login (no session cookie) before any DB query, and env.ts
          # only checks the URL shape, never connecting. So a syntactically-valid dummy boots the server
          # and a 2xx/3xx proves the pruned image starts and serves without a real database.
          docker run -d --name saldo-web-ci -p 3000:3000 \
            -e DATABASE_URL='postgres://smoke:smoke@127.0.0.1:5432/smoke' \
            saldo-web:ci
          # Poll until the server binds.
          code=000
          for _ in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/ || true)
            [ "$code" != "000" ] && break
            sleep 2
          done
          echo "GET / -> HTTP $code"
          docker logs saldo-web-ci | tail -30
          docker rm -f saldo-web-ci >/dev/null
          case "$code" in 2??|3??) echo "smoke OK";; *) echo "smoke FAILED"; exit 1;; esac
