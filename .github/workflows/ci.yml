name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: saldo
          POSTGRES_PASSWORD: saldo
          POSTGRES_DB: saldo
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U saldo"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://saldo:saldo@localhost:5432/saldo?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level=high # supply-chain gate
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm db:migrate # migration check against real Postgres
      - run: pnpm db:introspect # schema generation stays in sync with migrations
      - run: pnpm build
      - run: pnpm saft:validate # SAF-T XSD validation
