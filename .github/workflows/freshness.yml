name: Freshness

# Weekly health sweep: cited-source freshness + contradiction gate (lint:repo), dependency audit,
# and unused-code detection (knip). Findings are funneled into ONE rolling tracking issue rather than
# failing CI — the job itself always stays green (it reports, it does not gate). See ADR 0017.

on:
  schedule:
    - cron: '17 6 * * 1' # weekly, Monday 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: freshness
  cancel-in-progress: false

jobs:
  freshness:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TITLE: '🔧 Weekly repo freshness'
    steps:
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run freshness checks
        id: checks
        run: |
          set +e
          report=freshness-report.md
          : > "$report"
          problems=0
          {
            echo "## 🔧 Weekly repo freshness"
            echo ""
            echo "_Generated $(date -u '+%Y-%m-%d %H:%M UTC') from \`${GITHUB_SHA::7}\`._"
            echo ""
          } >> "$report"

          run_check () {
            name="$1"; shift
            out="$("$@" 2>&1)"; code=$?
            if [ "$code" -ne 0 ]; then
              problems=1
              echo "<details open><summary>❌ <strong>$name</strong> (exit $code)</summary>" >> "$report"
            elif printf '%s' "$out" | grep -qiE 'warn|unused'; then
              problems=1
              echo "<details open><summary>⚠️ <strong>$name</strong> — see output</summary>" >> "$report"
            else
              echo "<details><summary>✅ <strong>$name</strong></summary>" >> "$report"
            fi
            { echo ""; echo '```'; printf '%s\n' "$out" | tail -60; echo '```'; echo "</details>"; echo ""; } >> "$report"
          }

          run_check "lint:repo (cited-source verify-by + contradiction gate)" pnpm -s lint:repo
          run_check "pnpm audit (high and above)" pnpm audit --audit-level=high
          run_check "knip (unused files / exports / deps)" pnpm -s knip

          echo "problems=$problems" >> "$GITHUB_OUTPUT"
          cat "$report"
      - name: Upsert the rolling tracking issue
        run: |
          set -e
          existing="$(gh issue list --state open --search 'repo freshness in:title' --json number --jq '.[0].number' 2>/dev/null || true)"
          if [ "${{ steps.checks.outputs.problems }}" = "1" ]; then
            if [ -n "$existing" ]; then
              gh issue edit "$existing" --body-file freshness-report.md
              gh issue comment "$existing" --body "Refreshed $(date -u '+%Y-%m-%d')."
            else
              gh issue create --title "$TITLE" --body-file freshness-report.md
            fi
          elif [ -n "$existing" ]; then
            gh issue comment "$existing" --body "✅ All freshness checks clean as of $(date -u '+%Y-%m-%d'). Closing."
            gh issue close "$existing"
          fi
