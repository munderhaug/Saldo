# Local development services. `docker compose -f infra/compose.yaml up -d`.
# Production deploys this app container per ADR 0015 (EU PaaS + Cloudflare/R2 + Neon EU); a
# self-hosted EU stack (PostgreSQL + MinIO/Garage) is the ADR 0008 sovereignty fallback.
name: saldo

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: saldo
      POSTGRES_PASSWORD: saldo
      POSTGRES_DB: saldo
    ports:
      - '5432:5432'
    volumes:
      - ./.data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U saldo']
      interval: 5s
      timeout: 5s
      retries: 10

  # S3-compatible object storage for documents (receipts/PDF/SAF-T).
  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: saldo
      MINIO_ROOT_PASSWORD: saldo-dev-secret
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - ./.data/minio:/data

  # Optional: local LLM for receipt extraction (uncomment + `ollama pull qwen2.5-vl`).
  # ollama:
  #   image: ollama/ollama
  #   ports: ['11434:11434']
  #   volumes: ['./.data/ollama:/root/.ollama']

  # Optional: self-hosted Langfuse for LLM traces/evals (needs its own datastores; see docs).
